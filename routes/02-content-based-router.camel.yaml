- route:
    id: content-based-router
    description: "Routes messages based on their content"
    from:
      uri: timer:cbr
      parameters:
        period: 3000
        delay: 1000
      steps:
        - setBody:
            simple: "${random(1,100)}"
        - choice:
            when:
              - simple:
                  expression: "${body} < 30"
                steps:
                  - setBody:
                      constant: "Low value (< 30)"
                  - log:
                      message: "Route 1: ${body}"
              - simple:
                  expression: "${body} < 70"
                steps:
                  - setBody:
                      constant: "Medium value (30-70)"
                  - log:
                      message: "Route 2: ${body}"
            otherwise:
              steps:
                - setBody:
                    constant: "High value (>= 70)"
                - log:
                    message: "Route 3: ${body}"
