- restConfiguration:
    component: platform-http
    host: 0.0.0.0
    port: 8080
    apiProperty:
      - key: api.title
        value: "Camel REST API"
      - key: api.version
        value: "1.0.0"

- rest:
    path: /hello
    get:
      - to: "direct:get-hello"
    post:
      - to: "direct:post-hello"


- route:
    id: get-hello
    from:
      uri: "direct:get-hello"
      steps:
        - setBody:
            constant: '{"message": "Hello from Camel REST!"}'
        - setHeader:
            name: Content-Type
            constant: application/json
        - log:
            message: "GET /hello called"

- route:
    id: post-hello
    from:
      uri: "direct:post-hello"
      steps:
        - log:
            message: "POST /hello received: ${body}"
        - setBody:
            simple: '{"received": "${body}", "status": "ok"}'
        - setHeader:
            name: Content-Type
            constant: application/json