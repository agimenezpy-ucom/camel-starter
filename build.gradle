plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter:4.1.0'
    implementation 'org.apache.camel.springboot:camel-yaml-dsl-starter:4.1.0'
    implementation 'org.apache.camel.springboot:camel-platform-http-starter:4.1.0'
    implementation 'org.apache.camel.springboot:camel-rest-starter:4.1.0'
    implementation 'org.apache.camel.springboot:camel-jackson-starter:4.1.0'
    implementation 'org.apache.camel:camel-timer:4.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
            srcDir 'routes'
            include '**/*.yaml'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
